<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nathan Allen Pirtle | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #e8ecee;
    font-family: 'DM Sans', sans-serif;
    color: #53606a;
    padding-top: 56px;
}

.container {
    width: min(1272px, calc(100% - 48px));
    margin: auto;
    background: white;
    border-radius: 38px 38px 0 0;
    overflow: hidden;
    min-height: 100vh;
}

header {
    min-height: 126px;
    padding: 28px 12px 28px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 800;
}

.contact {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 22px 32px;
    background: white;
    border-radius: 22px;
    box-shadow: 0 12px 35px #00000018;
    color: #53606a;
    text-decoration: none;
}

.hero {
    min-height: 605px;
    padding: 72px 84px;
    display: grid;
    grid-template-columns: 404px 1fr;
    align-items: center;
    gap: 84px;
    background: linear-gradient(118deg, #ffbd91, #e98c7d, #c85b83);
}

.profile {
    width: 100%;
    aspect-ratio: .86;
    padding: 5px;
    border: 1px solid white;
    border-radius: 24px;
    background: #ffffff40;
    box-shadow: 0 22px 45px #5d2c372e;
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    border-radius: 19px;
}

.content h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(42px, 5.2vw, 66px);
    color: white;
    margin-bottom: 40px;
}

.content p {
    color: #ffffffdc;
    font-size: 20px;
    line-height: 1.75;
}

.line {
    width: 74px;
    height: 4px;
    background: #ffffffad;
    border-radius: 10px;
    margin: 48px 0;
}

.socials {
    display: flex;
    gap: 25px;
}

.socials a {
    width: 60px;
    height: 62px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 21px;
    background: white;
    color: #df7867;
    font-size: 29px;
    font-weight: bold;
    text-decoration: none;
    transition: .3s;
}

.socials a:hover {
    transform: translateY(-5px);
    background: #fff8f5;
}

footer {
    text-align: center;
    padding: 24px;
    font-size: 13px;
}

@media(max-width: 760px) {
    body {
        padding-top: 18px;
    }

    .container {
        width: calc(100% - 24px);
        border-radius: 26px 26px 0 0;
    }

    header {
        min-height: 96px;
        padding: 20px 18px 20px 24px;
    }

    .logo {
        font-size: 22px;
    }

    .contact {
        padding: 14px;
        font-size: 14px;
    }

    .hero {
        grid-template-columns: 1fr;
        gap: 38px;
        padding: 42px 26px 54px;
    }

    .profile {
        width: min(100%, 330px);
        margin: auto;
        aspect-ratio: .9;
    }

    .content {
        text-align: center;
    }

    .content h1 {
        font-size: 42px;
        margin-bottom: 22px;
    }

    .content p {
        font-size: 16px;
    }

    .line {
        margin: 30px auto;
    }

    .socials {
        justify-content: center;
        gap: 16px;
    }

    .socials a {
        width: 54px;
        height: 54px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">Nathan Allen Pirtle</div>

    <a href="mailto:hello@example.com" class="contact">
        Get in touch ✉
    </a>
</header>

<section class="hero">

    <div class="profile">
        <img src="profile.jpg" alt="Nathan Allen Pirtle">
    </div>

    <div class="content">

        <h1>Nathan Allen Pirtle</h1>

        <p>
            Meet Nathan Allen Pirtle USA, a recognized social media
            professional celebrated for creative strategies, digital
            influence, and audience growth across platforms.
        </p>

        <div class="line"></div>

        <div class="socials">

            <a href="#" target="_blank">in</a>

            <a href="#" target="_blank">●</a>

            <a href="#" target="_blank">𝕏</a>

        </div>

    </div>

</section>

<footer>
    © <span id="year"></span> Nathan Allen Pirtle. All rights reserved.
</footer>

</div>

<script>
document.getElementById("year").textContent =
new Date().getFullYear();
</script>

</body>
</html>
